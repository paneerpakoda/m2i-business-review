<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/m2i-business-review/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Interactive Money2India Business onboarding prototype.">
  <!-- BankNav starts at DsColors.hero.colors.first: extend that solid colour
       into browser-owned safe areas, without stretching the header gradient. -->
  <meta name="theme-color" content="#EF8C24">
  <style>
    html, body {
      background-color: #FFFFFF;
    }
    /* Flutter paints its header on a canvas. This solid top edge gives Safari
       a fixed DOM colour to extend, while the bottom browser area stays white. */
    #browser-top-edge {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: #EF8C24;
      pointer-events: none;
      z-index: 0;
    }
    #app-loading {
      align-items: center;
      background: #FFFFFF;
      color: #333333;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      gap: 12px;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 1;
    }
    #app-loading::before {
      background: #E3530F;
      border-radius: 999px;
      content: '';
      height: 8px;
      width: 48px;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Money2India Business">

  <!-- Favicon -->

  <title>Money2India Business</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="browser-top-edge" aria-hidden="true"></div>
  <div id="app-loading" role="status" aria-live="polite">
    Loading Money2India Business…
  </div>
  <script>
    // Keep localhost reviews fresh even when an older build was cached before
    // the preview server started sending Cache-Control: no-store.
    const localPreview = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const bootstrap = document.createElement('script');
    bootstrap.src = 'flutter_bootstrap.js' + (localPreview ? '?preview=' + Date.now() : '');
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
